<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AE Systems Marketing Poster</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#020308;

    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding:30px;

}

.download-btn{

    background:#0284C7;

    color:white;

    border:none;

    padding:14px 30px;

    border-radius:10px;

    cursor:pointer;

    font-size:16px;

    font-weight:700;

    margin-bottom:25px;

}

.download-btn:hover{

    background:#0369a1;

}

.poster{

    width:700px;

    aspect-ratio: 1/1;
    background:#020308;

    border:1px solid #27272a;

    overflow:hidden;

    position:relative;

    padding:42px;

}

.glow{

    position:absolute;

    right:-180px;

    top:-180px;

    width:420px;

    height:420px;

    border-radius:50%;

    background:#0284C7;

    opacity:.12;

    filter:blur(90px);

}

.logo{

    text-align:center;

    margin-bottom:8px;

}

.logo img{

    width:55px;

    margin-bottom:10px;

}

.brand{

    color:#0284C7;

    font-size:18px;

    letter-spacing:.35em;

    font-weight:700;

}

h1{

    margin:16px 0 12px;

    color:white;

    text-align:center;

    font-size:68px;

    line-height:.92;

    letter-spacing:-3px;

    font-weight:800;

}

.showcase{

    display:flex;

    justify-content:center;

    margin-top:-45px;

    margin-bottom:-40px;

    position:relative;

}

.showcase img{

    width:100%;

    max-width:520px;

    display:block;

}

.offer{

    position:absolute;

    top:370px;

    left:35px;

    width:180px;

    border-radius:28px;

    padding:18px;

    z-index:20;

    text-align:center;

    background:#0284C7;

    color:white;

}

.price{

    color:#0284C7;

    font-size:54px;

    font-weight:800;

}

.from{

    color:#94A3B8;

    font-size:22px;

    margin-bottom:6px;

}

.delivery{

    display:inline-block;
    position: absolute;
    top: 285px;
    right: 35px;

    margin-top:20px;

    padding:10px 20px;

    border-radius:999px;

    border:1px solid rgba(2,132,199,.35);

    background:rgba(2,132,199,.08);

    color:#7dd3fc;

    font-size:17px;

    font-weight:600;

}

.footer{

    position:absolute;

    bottom:28px;

    left:42px;

    right:42px;

    border:none;

    padding:0;

}

.website{

    color:#0284C7;

    font-size:24px;

    font-family:monospace;

}

.qr{

    width:78px;

    height:78px;

}

</style>

</head>

<body>

<button class="download-btn" onclick="downloadPoster()">

<script>

function downloadPoster(){

    html2canvas(document.getElementById("poster"),{

        scale:2,

        useCORS:true

    }).then(canvas=>{

        const link=document.createElement("a");

        link.download="AE_Marketing_Poster.png";

        link.href=canvas.toDataURL();

        link.click();

    });

}

</script>
